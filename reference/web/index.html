<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="One sentence about the app." />
    <meta name="theme-color" content="#141416" />

    <!-- Apply the last-used theme before first paint (see src/lib/theme.ts).
         "myapp" is BRAND.storagePrefix from src/lib/brand.config.ts. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("myapp.themeVars") || "null");
        if (t) {
          var r = document.documentElement;
          for (var k in t.vars) r.style.setProperty(k, t.vars[k]);
          r.style.colorScheme = t.scheme;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", t.background);
        }
      } catch (e) {}
    </script>

    <!-- Installed-app feel on phones (home-screen web app). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My app" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <title>My app</title>
  </head>
  <body class="bg-bg text-text-base font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
